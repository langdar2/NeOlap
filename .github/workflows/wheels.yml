name: Python wheels

# One abi3 wheel per platform (Python >= 3.9). Built on every pull request touching the Python
# module and on version tags; published to GitHub releases on tags only. The wheel is installed
# and imported on each platform, so a wheel that does not load is found here, not by a user.
on:
  pull_request:
    paths: ["crates/neolap-py/**", "crates/neolap-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/wheels.yml"]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag (e.g. v1.0.0) to attach the wheels to; empty = build only"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-15-intel, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --target ${{ matrix.target }} -m crates/neolap-py/Cargo.toml
          manylinux: auto
      - name: Install the wheel into a clean environment and import it
        shell: bash
        run: |
          python -m venv clean
          if [ -d clean/Scripts ]; then PY=clean/Scripts/python; else PY=clean/bin/python; fi
          $PY -m pip install --no-index --find-links dist neolap
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/$PY" -c "import neolap; print(neolap.version()); assert neolap.version() == neolap.__version__"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" dist/*.whl --repo "${GITHUB_REPOSITORY}" --clobber || gh release create "$TAG" dist/*.whl --repo "${GITHUB_REPOSITORY}" --generate-notes
