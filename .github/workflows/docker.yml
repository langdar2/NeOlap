name: Docker

# Builds the image, starts it with docker compose and checks health and shutdown.
# On version tags (v*), a multi-arch image (amd64 + arm64) is pushed to
# ghcr.io/langdar2/neolap. arm64 is built via QEMU emulation and is slow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: docker compose config --quiet && docker compose --profile tls config --quiet
      - name: Build and start
        env:
          NEOLAP_ADMIN_USER: ci
          NEOLAP_ADMIN_PASSWORD: ci-password-for-the-test
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Health and web UI
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health
          curl -fsS http://127.0.0.1:8080/ | grep -q NeOlap
          docker compose ps
          test "$(docker inspect --format '{{.State.Health.Status}}' neolap-neolap-1)" = healthy
      - name: Login, protected routes and data in the volume
        run: |
          U=http://127.0.0.1:8080/api/v1
          # without login the API is closed
          test "$(curl -s -o /dev/null -w '%{http_code}' $U/model)" = 401
          # the first administrator from the environment can log in; a wrong password cannot
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' -d '{"user":"ci","password":"wrong wrong wrong"}' $U/login)" = 401
          R=$(curl -fsS -c jar -H 'content-type: application/json' -d '{"user":"ci","password":"ci-password-for-the-test"}' $U/login)
          CSRF=$(echo "$R" | sed 's/.*"csrf":"\([^"]*\)".*/\1/')
          curl -fsS -b jar $U/me | grep -q '"role":"admin"'
          # a write without the CSRF token is refused, with it a backup is written
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar -X POST -H 'content-type: application/json' -d '{}' $U/admin/backup)" = 403
          curl -fsS -b jar -H "x-csrf-token: $CSRF" -X POST -H 'content-type: application/json' -d '{}' $U/admin/backup | grep -q 'backup-'
          # the data survives a restart (named volume), and the environment is not needed again
          docker compose restart neolap
          docker compose up -d --wait --wait-timeout 60
          R=$(curl -fsS -c jar -H 'content-type: application/json' -d '{"user":"ci","password":"ci-password-for-the-test"}' $U/login)
          echo "$R" | grep -q '"role":"admin"'
          # the image has no shell, but the CLI can read the stopped database from a one-off container
          docker compose stop neolap
          docker compose run --rm --no-deps --entrypoint /usr/local/bin/neolap neolap user list /data/neolap.neolap | grep -q ci
          docker compose up -d --wait --wait-timeout 60
      - name: Graceful shutdown on SIGTERM
        run: |
          docker compose stop -t 30 neolap
          docker compose logs neolap | tee logs.txt
          grep -q "NeOlap stopped" logs.txt
          test "$(docker inspect --format '{{.State.ExitCode}}' neolap-neolap-1)" = 0
      - name: Image size
        run: docker image ls neolap:local
      - if: always()
        run: docker compose down -v

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compose-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/langdar2/neolap
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
