[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "neolap"
description = "NeOlap – lightweight multidimensional database (Python bindings)"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Database :: Database Engines/Servers",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.5", "numpy>=1.23"]
test = ["pytest>=8", "pandas>=1.5", "numpy>=1.23"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "neolap._native"
